name: Canvas assignments

# Every 2 hours, fetch the Canvas calendar feed and save upcoming assignments to canvas.json.
# With the optional CANVAS_TOKEN secret it also saves class names, grades, submitted work and missing work.
# ZERØ GAP reads that file when it syncs. Run it by hand from the Actions tab any time.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canvas
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned to an exact commit

      - name: Fetch the Canvas feed
        env:
          CANVAS_FEED_URL: ${{ secrets.CANVAS_FEED_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: python3 scripts/canvas_feed.py

      - name: Save canvas.json if it changed
        run: |
          git add canvas.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "zero-gap-canvas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Canvas assignments"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
